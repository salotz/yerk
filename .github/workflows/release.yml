# Release pipeline: on vB.R.G tags (Growth Versioning, ADR 023).
# Builds stamped linux/amd64 binary, checksum, GitHub Release assets.
# Install channel registration (mise/ubi/…) is later install-distribution work.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag (B.R.G)
        id: ver
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*)
              ver="${tag#v}"
              ;;
            *)
              echo "error: tag must be vB.R.G (got ${tag})" >&2
              exit 1
              ;;
          esac
          # reject prerelease / extra suffixes
          case "$ver" in
            *[!0-9.]* | *..* | *.*.*.*) echo "error: invalid B.R.G ${ver}" >&2; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build linux/amd64
        env:
          YERK_VERSION: ${{ steps.ver.outputs.version }}
          YERK_COMMIT: ${{ github.sha }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          # short commit for stamp
          export YERK_COMMIT="$(printf '%s' "$YERK_COMMIT" | cut -c1-7)"
          GOOS=linux GOARCH=amd64 \
            sh .tasks/build-yerk "dist/yerk_${{ steps.ver.outputs.version }}_linux_amd64"
          # stable name inside the tarball
          cp "dist/yerk_${{ steps.ver.outputs.version }}_linux_amd64" dist/yerk
          tar -C dist -czf "dist/yerk_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz" yerk
          rm -f dist/yerk
          (
            cd dist
            sha256sum "yerk_${{ steps.ver.outputs.version }}_linux_amd64" \
              "yerk_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz" \
              > "yerk_${{ steps.ver.outputs.version }}_SHA256SUMS"
          )
          ./dist/yerk_${{ steps.ver.outputs.version }}_linux_amd64 version

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/yerk_${{ steps.ver.outputs.version }}_linux_amd64
            dist/yerk_${{ steps.ver.outputs.version }}_linux_amd64.tar.gz
            dist/yerk_${{ steps.ver.outputs.version }}_SHA256SUMS
