# Release pipeline: on vB.R.G tags (Growth Versioning, ADR 023).
# Builds stamped linux/amd64 binary, checksums, GitHub Release assets, then a
# signed packslip bundle (https://packslip.dev/) for mise and other installers.
#
# Signer: this workflow file only (consumers pin workflow path). Do not move
# packslip signing to a different workflow without a consumer trust reset.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: build-publish-packslip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse tag (B.R.G)
        id: ver
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*)
              ver="${tag#v}"
              ;;
            *)
              echo "error: tag must be vB.R.G (got ${tag})" >&2
              exit 1
              ;;
          esac
          case "$ver" in
            *[!0-9.]* | *..* | *.*.*.*)
              echo "error: invalid B.R.G ${ver}" >&2
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          # packslip / common CLI layout (linux-x64, not GOARCH amd64 spelling)
          echo "artifact_stem=yerk-${ver}-linux-x64" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build linux/amd64 archive
        env:
          YERK_VERSION: ${{ steps.ver.outputs.version }}
          YERK_COMMIT: ${{ github.sha }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          export YERK_COMMIT="$(printf '%s' "$YERK_COMMIT" | cut -c1-7)"
          stem="${{ steps.ver.outputs.artifact_stem }}"
          GOOS=linux GOARCH=amd64 \
            sh .tasks/build-yerk "dist/${stem}.bin"
          # Archive root = bare `yerk` (Go CLI packslip recipe).
          cp "dist/${stem}.bin" dist/yerk
          tar -C dist -czf "dist/${stem}.tar.gz" yerk
          rm -f dist/yerk
          (
            cd dist
            sha256sum "${stem}.bin" "${stem}.tar.gz" \
              > "yerk-${{ steps.ver.outputs.version }}_SHA256SUMS"
          )
          "./dist/${stem}.bin" version

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ steps.ver.outputs.artifact_stem }}.bin
            dist/${{ steps.ver.outputs.artifact_stem }}.tar.gz
            dist/yerk-${{ steps.ver.outputs.version }}_SHA256SUMS

      - name: Sign packslip and upload bundle
        uses: jdx/packslip@v1
        id: packslip
        with:
          # Only the installable archive (not the bare .bin or checksum file).
          artifacts: dist/${{ steps.ver.outputs.artifact_stem }}.tar.gz
          bin: yerk
          tag: ${{ steps.ver.outputs.tag }}
          version: ${{ steps.ver.outputs.version }}
          project: github.com/salotz/yerk
          # Public repo: attest + link provenance. Private non-GHEC would need false.
          attest: true
          upload: true
