# Example yerk project catalog.
# Copy to ~/.config/yerk/catalog.toml (or set YERK__CATALOG / YERK__CONFIG_DIR).
#
# Catalog is the portable registry: identity, remote, tags, optional style
# overrides. Host placement: config.toml [domains] default <root>/<name>
# and optional [[projects]] path overrides (ADR 014). Domain is the id
# namespace (ADR 012); optional domain roots use the same string.
#
# Optional placement fields (ADR 013 / 016 / 018):
#   workspace_style = "project-dir"
#   workspace_style = "name-tags"
#   workspace_style = { style = "name-tags", main_dir = "~/.app", replica_dir = "~/tree/…/app" }
#   replica_method = "worktree"   # or "clone" for yerk replica create
#
# Declare the closed tag vocabulary first (ADR 010).

tags = []

[[projects]]
name = "example"
domain = "personal"
remote = "git@github.com:example/example.git"
# tags = ["devel"]
# default_replica = "main"
# workspace_style = "workspace-dir"
